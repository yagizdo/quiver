name: tests

on:
  push:
    branches: [master]
  pull_request:

# One run per ref. A new push to a PR cancels the run still queued or running for
# the previous commit, so superseded commits stop holding a place in the runner queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tests/run-all.sh
